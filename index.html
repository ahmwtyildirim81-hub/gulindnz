<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erişim Engellendi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="blocked.css">
</head>
<body>
    <div class="container">
        <div class="blocked-content">
            <div class="icon-wrapper">
                <i class="fa-solid fa-ban"></i>
            </div>
            <h1 class="title">ERİŞİM ENGELLENDİ</h1>
            <div class="divider"></div>
            <p class="main-message">Yengeniz İzin Vermedi</p>
            <p class="sub-message">Bu sayfaya erişim yetkiniz bulunmamaktadır.</p>
            <p class="reason">Yenge kızdı.</p>
            
            <div class="error-code">
                <p>Hata Kodu: 403 - FORBIDDEN</p>
                <p class="timestamp" id="timestamp"></p>
            </div>

            <div class="actions">
                <button class="btn-primary" onclick="window.location.reload()">
                    <i class="fa-solid fa-rotate-right"></i> Tekrar Dene
                </button>
                <button class="btn-secondary" onclick="goBack()">
                    <i class="fa-solid fa-arrow-left"></i> Geri Dön
                </button>
            </div>

            <div class="footer-note">
                <p>Eğer bu bir hata olduğunu düşünüyorsanız, lütfen melih ile iletişime geçin.</p>
            </div>
        </div>
    </div>

    <script>
        // Timestamp
        const now = new Date();
        document.getElementById('timestamp').textContent = 
            `Tarih: ${now.toLocaleDateString('tr-TR')} ${now.toLocaleTimeString('tr-TR')}`;

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
